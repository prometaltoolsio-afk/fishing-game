<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Castle Defense 2D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="1280" height="720"></canvas>

      <!-- বাম দিকের নিচের কোণে আর্চার ও ক্যানন সিলেকশন আইকন -->
      <div class="weapon-selector" id="weaponSelector">
        <button id="selectArcherBtn" class="weapon-btn" type="button" title="Select Archer">
          <img src="archer.png" alt="Archer">
        </button>
        <button id="selectCannonBtn" class="weapon-btn active" type="button" title="Select Cannon">
          <img src="CANNON.png" alt="Cannon">
        </button>
      </div>

      <!-- ডান দিকের নিচের কোণে FIRE বাটন -->
      <button id="fireBtn" type="button">FIRE</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
