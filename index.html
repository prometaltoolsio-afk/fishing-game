<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Monster Clash – Battle Quest</title>
  <link rel="stylesheet" href="style.css">
  <!-- Matter.js physics engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>

    <!-- HUD Overlay -->
    <div id="hud" class="ui-layer hidden">
      <div class="hud-top">
        <div class="hud-left">
          <button id="btn-pause" class="icon-btn">⏸</button>
          <button id="btn-restart" class="icon-btn">🔄</button>
          <span id="level-display" class="hud-badge">Level 1</span>
        </div>
        <div class="hud-center">
          <div id="score-display">Score: 0</div>
          <div id="stars-live">
            <span class="star-icon">★</span>
            <span class="star-icon">★</span>
            <span class="star-icon">★</span>
          </div>
        </div>
        <div class="hud-right">
          <span id="coins-display" class="hud-badge coin-badge">🪙 0</span>
        </div>
      </div>
      <div id="hero-dock" class="hero-dock">
        <!-- Hero queue rendered here -->
      </div>
    </div>

    <!-- Main Menu Screen -->
    <div id="menu-screen" class="ui-screen">
      <div class="menu-box">
        <h1 class="game-title">MONSTER CLASH<span class="subtitle">BATTLE QUEST</span></h1>
        <div class="menu-buttons">
          <button id="btn-play" class="btn btn-primary">PLAY</button>
          <button id="btn-levels" class="btn btn-secondary">LEVELS</button>
          <button id="btn-heroes" class="btn btn-secondary">HEROES</button>
          <button id="btn-daily" class="btn btn-gold">DAILY REWARD</button>
          <button id="btn-sound-toggle" class="btn btn-small">🔊 SOUND: ON</button>
        </div>
      </div>
    </div>

    <!-- Level Select Screen -->
    <div id="level-screen" class="ui-screen hidden">
      <div class="modal-box wide">
        <h2>SELECT LEVEL</h2>
        <div id="level-grid" class="level-grid"></div>
        <button id="btn-level-back" class="btn btn-secondary mt-10">BACK</button>
      </div>
    </div>

    <!-- Hero Collection Screen -->
    <div id="hero-screen" class="ui-screen hidden">
      <div class="modal-box wide">
        <h2>HERO COLLECTION</h2>
        <div id="hero-grid" class="hero-grid"></div>
        <button id="btn-hero-back" class="btn btn-secondary mt-10">BACK</button>
      </div>
    </div>

    <!-- Pause Screen -->
    <div id="pause-screen" class="ui-screen hidden modal-blur">
      <div class="modal-box">
        <h2>PAUSED</h2>
        <div class="menu-buttons">
          <button id="btn-resume" class="btn btn-primary">RESUME</button>
          <button id="btn-pause-restart" class="btn btn-secondary">RESTART</button>
          <button id="btn-pause-menu" class="btn btn-danger">MAIN MENU</button>
        </div>
      </div>
    </div>

    <!-- Win Screen -->
    <div id="win-screen" class="ui-screen hidden modal-blur">
      <div class="modal-box bounce-in">
        <h2 class="text-win">VICTORY!</h2>
        <div id="win-stars" class="star-rating-large"></div>
        <div id="win-score" class="result-score">Score: 0</div>
        <div id="win-coins" class="result-coins">+0 Coins</div>
        <div class="menu-buttons horizontal">
          <button id="btn-next-level" class="btn btn-primary">NEXT</button>
          <button id="btn-win-replay" class="btn btn-secondary">REPLAY</button>
          <button id="btn-win-menu" class="btn btn-secondary">MENU</button>
        </div>
      </div>
    </div>

    <!-- Lose Screen -->
    <div id="lose-screen" class="ui-screen hidden modal-blur">
      <div class="modal-box shake">
        <h2 class="text-lose">DEFEAT!</h2>
        <p>Monsters survived! Try a different trajectory or hero power.</p>
        <div class="menu-buttons horizontal">
          <button id="btn-lose-replay" class="btn btn-primary">RETRY</button>
          <button id="btn-lose-menu" class="btn btn-secondary">MENU</button>
        </div>
      </div>
    </div>
  </div>

  <script src="physics.js"></script>
  <script src="levels.js"></script>
  <script src="game.js"></script>
</body>
</html>
